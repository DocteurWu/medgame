server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    # ACTIVE LE NIVEAU 1 ICI (Gzip Static)
    gzip_static on; 
    
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_http_version 1.0;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json application/javascript;

    # ── Sécurité : bloquer tous les fichiers cachés (.env, .git, ...) ──
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── En-têtes de sécurité ──
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; media-src 'self' data: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co http://127.0.0.1:8081; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

    location / {
        index index.html;
        try_files $uri $uri/ =404;
    }

    # NIVEAU 2 : Cache Intelligent (Logique et Données)
    location ~* \.(js|json|html|css)$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # NIVEAU 2 bis : Cache Statique (Images et Sons) - 30 jours
    location ~* \.(?:webp|png|jpg|jpeg|gif|ico|mp3|ogg|wav)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }
}
