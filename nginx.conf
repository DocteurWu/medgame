server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    # ACTIVE LE NIVEAU 1 ICI (Gzip Static)
    gzip_static on; 
    
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_http_version 1.0;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json application/javascript;

    # ── Sécurité : bloquer tous les fichiers cachés (.env, .git, ...) ──
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── En-têtes de sécurité ──
    # IMPORTANT : dans nginx, un add_header déclaré dans un `location` REMPLACE
    # tous les add_header hérités du `server`. On factorise donc la CSP et les
    # en-têtes dans un fichier inclus, puis on le réinclut dans chaque location.
    include /etc/nginx/snippets/medgame-security.conf;

    location / {
        index index.html;
        try_files $uri $uri/ =404;
    }

    # NIVEAU 2 : Cache Intelligent (Logique et Données)
    location ~* \.(js|json|html|css)$ {
        include /etc/nginx/snippets/medgame-security.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # NIVEAU 2 bis : Cache Statique (Images et Sons) - 30 jours
    location ~* \.(?:webp|png|jpg|jpeg|gif|ico|svg|woff2?|mp3|ogg|wav|glb|gltf|bin|ktx2|exr)$ {
        include /etc/nginx/snippets/medgame-security.conf;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }

    # NIVEAU 3 : Assets volumineux jamais mutables (modèles 3D, textures, atlas)
    location ~* ^/(assets|neuro-atlas)/ {
        include /etc/nginx/snippets/medgame-security.conf;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }
}
