# ─────────────────────────────────────────────────────────────────────────────
# En-têtes de sécurité MedGame — À INCLURE dans chaque `server` ET chaque
# `location` qui déclare son propre `add_header`.
#
# Pourquoi ce fichier existe : dans nginx, dès qu'un `location` contient au
# moins un `add_header`, TOUS les `add_header` hérités du `server` sont
# ignorés. Sans cet include, les en-têtes de sécurité disparaissent sur les
# assets (images, sons, modèles 3D) qui portent pourtant un Cache-Control.
#
# Ce contenu doit rester identique à la CSP de `_headers` et `netlify.toml`
# (tests : test/neuro-atlas.test.mjs vérifie la cohérence entre eux).
# ─────────────────────────────────────────────────────────────────────────────
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob: https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com; worker-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob:; child-src 'self' blob:; frame-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; media-src 'self' data: blob:; connect-src 'self' blob: data: https://dl.polyhaven.org https://*.supabase.co wss://*.supabase.co https://cdn.jsdelivr.net https://unpkg.com http://127.0.0.1:8081 http://localhost:8081 https://api.deepseek.com https://api.groq.com https://openrouter.ai; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;