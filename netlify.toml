[build]
  publish = "."

[build.environment]
  # Exempter l'email de contact et l'URL Supabase publique du scanner de secrets Netlify
  SECRETS_SCAN_OMIT_KEYS = "QUOTA_CONTACT_EMAIL,SUPABASE_URL"

# Proxy LLM — la fonction est appelée directement par le client via
# /.netlify/functions/llm-proxy (aucune clé API côté client).
# Redirection d'alias propre :
[[redirects]]
  from = "/api/llm/*"
  to = "/.netlify/functions/llm-proxy"
  status = 200

[[redirects]]
  from = "/api/jev/*"
  to = "/.netlify/functions/jev-proxy"
  status = 200

# ── En-têtes de sécurité ─────────────────────────────────────────
# CSP pragmatique : 'unsafe-inline' requis (handlers inline et styles générés),
# autorisant les iframes internes (sameorigin) pour le module neuro-atlas.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob: https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com; worker-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob:; child-src 'self' blob:; frame-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; media-src 'self' data: blob:; connect-src 'self' blob: data: https://dl.polyhaven.org https://*.supabase.co wss://*.supabase.co https://cdn.jsdelivr.net https://unpkg.com http://127.0.0.1:8081 http://localhost:8081 https://api.deepseek.com https://api.groq.com https://openrouter.ai; frame-ancestors 'self'; base-uri 'self'; object-src 'none'"

# ── Cache des assets volumineux et immuables ──────────────────────────────────
# Miroir de nginx.conf : la logique et les données sont revalidées, les assets
# binaires sont cachés longtemps.

# Le code applicatif se revalide à chaque requête.
# C'est la contrepartie directe de la suppression des jetons `?v=` : sans cette
# règle, un `js/` servi en cache long finirait par servir une version périmée
# (c'était précisément le rôle du `?v=`, mais il dupliquait les modules ES).
# Miroir de `location ~* \.(js|json|html|css)$` dans nginx.conf.
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/neuro-atlas/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/neuro-atlas/data/volumes/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Les cas cliniques et données de gameplay sont versionnés par cas
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/.env"
  [headers.values]
    Cache-Control = "no-store"
