[build]
  publish = "."

# Proxy LLM — la fonction est appelée directement par le client via
# /.netlify/functions/llm-proxy (aucune clé API côté client).
# Redirection d'alias propre :
[[redirects]]
  from = "/api/llm/*"
  to = "/.netlify/functions/llm-proxy"
  status = 200

# ── En-têtes de sécurité ─────────────────────────────────────────
# CSP pragmatique : 'unsafe-inline' requis (handlers inline et styles générés),
# mais object-src/frame-ancestors/base-uri verrouillés.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; media-src 'self' data: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co http://127.0.0.1:8081 http://localhost:8081 https://api.deepseek.com https://api.groq.com https://openrouter.ai; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"

[[headers]]
  for = "/.env"
  [headers.values]
    Cache-Control = "no-store"
