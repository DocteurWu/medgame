name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Validate case JSONs (schéma + cohérences)
        run: npm run validate:cases

      - name: Syntax check (tous les modules js/)
        shell: bash
        run: |
          fail=0
          for f in js/*.js scripts/*.mjs; do
            if ! node --check "$f" 2>/tmp/err.txt; then
              echo "❌ $f"; cat /tmp/err.txt; fail=1
            fi
          done
          exit $fail
