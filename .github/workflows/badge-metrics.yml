name: Metrics

on:
  push:
    branches: [main, master]

jobs:
  lint-badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run validate:cases
      - run: |
          for f in js/*.js scripts/*.mjs; do node --check "$f"; done
          echo "✅ All badges green"
